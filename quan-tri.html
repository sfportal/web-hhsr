<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị hội viên · Hiệp hội Sầu riêng tỉnh Đắk Lắk</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g9:#06200f;--g7:#124a2c;--g5:#2f7d3a;--gold:#f5c518;--cream:#fbf6e6;--ink:#17231b;--muted:#5d6b61;--red:#b3261e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
button,input,select{font:inherit}
header{background:var(--g9);color:#fff;padding:14px 4vw;display:flex;align-items:center;gap:14px}
header img{width:42px;height:42px;border-radius:50%}
header b{display:block}header small{color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:.7rem}
header .sp{flex:1}
.out{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:7px 16px;cursor:pointer}
main{width:min(1280px,94vw);margin:28px auto}
.login{max-width:420px;margin:12vh auto;background:#fff;border-radius:22px;padding:32px;box-shadow:0 30px 60px -30px rgba(6,32,15,.4)}
.login h1{font-size:1.4rem;margin-bottom:6px}.login p{color:var(--muted);font-size:.92rem;margin-bottom:18px}
input,select{border:1px solid #d7d2bd;border-radius:12px;padding:11px 13px;background:#fff;width:100%}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;background:var(--gold);color:var(--g9)}
.btn.sec{background:#fff;border:1px solid #d7d2bd}
.err{color:var(--red);font-size:.9rem;min-height:1.3em;margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border:0;background:#fff;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--g7);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border-radius:18px;padding:16px 18px}.stat small{color:var(--muted);font-size:.8rem}.stat b{display:block;font-size:1.7rem;color:var(--g7)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input{max-width:320px}.bar select{max-width:200px}.bar .sp{flex:1}
.tbl{background:#fff;border-radius:18px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:900px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #efe9d6;vertical-align:top}
th{background:#f6f1df;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);position:sticky;top:0}
td small{color:var(--muted);display:block}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700}
.t-cho_duyet,.t-cho_doi_soat{background:#fff4c7;color:#7a5a00}.t-da_duyet,.t-da_nhan{background:#dff3d8;color:#1f5e26}.t-tu_choi,.t-khong_khop{background:#fde2df;color:var(--red)}
.act{display:flex;gap:6px;flex-wrap:wrap}.act button{border:1px solid #d7d2bd;background:#fff;border-radius:999px;padding:5px 12px;font-size:.8rem;cursor:pointer}
.act .ok{border-color:var(--g5);color:var(--g5)}.act .no{border-color:var(--red);color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><img src="assets/img/logo.png" alt=""><div><b>Quản trị hội viên</b><small>Hiệp hội Sầu riêng tỉnh Đắk Lắk</small></div><span class="sp"></span><button class="out" id="out" hidden>Đăng xuất</button></header>

<div class="login" id="login">
  <h1>Đăng nhập quản trị</h1>
  <p>Nhập mã quản trị do Hiệp hội cấp. Mã chỉ lưu trong phiên trình duyệt này.</p>
  <form id="lf"><input type="password" id="tok" placeholder="Mã quản trị" autocomplete="current-password" required><div class="err" id="lerr"></div><button class="btn" style="margin-top:8px">Đăng nhập</button></form>
</div>

<main id="app" hidden>
  <div class="tabs"><button class="on" data-v="dang-ky">Hồ sơ đăng ký</button><button data-v="hoi-phi">Hội phí</button></div>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input id="q" placeholder="Tìm tên, số điện thoại, mã hồ sơ, xã…">
    <select id="f"></select>
    <span class="sp"></span>
    <button class="btn sec" id="reload">Tải lại</button>
    <button class="btn" id="csv">Xuất Excel (CSV)</button>
  </div>
  <div class="tbl"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</main>

<script src="assets/js/config.js"></script>
<script>
(() => {
  const API = ((window.HHSR_CONFIG || {}).api || '').replace(/\/$/, '');
  const $ = s => document.querySelector(s);
  const LOAI = { ca_nhan: 'Nhà vườn, cá nhân', htx: 'HTX, tổ hợp tác', doanh_nghiep: 'Doanh nghiệp', chuyen_gia: 'Nhà khoa học, chuyên gia' };
  const NC = { tap_huan: 'Tập huấn', ma_vung_trong: 'Mã vùng trồng', truy_xuat: 'Truy xuất', lien_ket: 'Liên kết tiêu thụ' };
  const TT = { cho_duyet: 'Chờ duyệt', da_duyet: 'Đã duyệt', tu_choi: 'Từ chối', cho_doi_soat: 'Chờ đối soát', da_nhan: 'Đã nhận', khong_khop: 'Không khớp' };
  const STATES = { 'dang-ky': ['cho_duyet', 'da_duyet', 'tu_choi'], 'hoi-phi': ['cho_doi_soat', 'da_nhan', 'khong_khop'] };
  let tok = sessionStorage.getItem('hhsr_tok') || '', view = 'dang-ky', rows = [];
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => n == null ? '' : new Intl.NumberFormat('vi-VN').format(n) + ' đ';
  const when = s => s ? new Date(s.replace(' ', 'T') + 'Z').toLocaleString('vi-VN') : '';

  async function call(path, opt = {}) {
    if (!API) throw new Error('Chưa cấu hình địa chỉ API trong assets/js/config.js');
    const r = await fetch(API + path, { ...opt, headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', ...(opt.headers || {}) } });
    if (r.status === 401) { logout(); throw new Error('Mã quản trị không đúng'); }
    if (!r.ok) throw new Error('Lỗi máy chủ (' + r.status + ')');
    return r;
  }
  function logout() { tok = ''; sessionStorage.removeItem('hhsr_tok'); $('#app').hidden = true; $('#out').hidden = true; $('#login').hidden = false; }
  async function login() {
    try { await call('/api/admin/ping'); sessionStorage.setItem('hhsr_tok', tok); $('#login').hidden = true; $('#app').hidden = false; $('#out').hidden = false; setView('dang-ky'); }
    catch (e) { $('#lerr').textContent = e.message; }
  }
  $('#lf').addEventListener('submit', e => { e.preventDefault(); tok = $('#tok').value.trim(); $('#lerr').textContent = ''; login(); });
  $('#out').addEventListener('click', logout);

  function setView(v) {
    view = v;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    $('#f').innerHTML = '<option value="">Tất cả trạng thái</option>' + STATES[v].map(s => `<option value="${s}">${TT[s]}</option>`).join('');
    $('#th').innerHTML = v === 'dang-ky'
      ? '<tr><th>Mã hồ sơ</th><th>Hội viên</th><th>Liên hệ</th><th>Địa bàn</th><th>Quan tâm</th><th>Ngày gửi</th><th>Trạng thái</th><th></th></tr>'
      : '<tr><th>Mã hồ sơ / SĐT</th><th>Năm</th><th>Mức phí</th><th>Số tiền</th><th>Nội dung CK</th><th>Ngày báo</th><th>Trạng thái</th><th></th></tr>';
    load();
  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));

  async function load() {
    $('#tb').innerHTML = '<tr><td colspan="8" class="empty">Đang tải…</td></tr>';
    try { rows = (await (await call('/api/admin/' + view)).json()).rows || []; render(); }
    catch (e) { $('#tb').innerHTML = `<tr><td colspan="8" class="empty">${esc(e.message)}</td></tr>`; }
  }
  function render() {
    const q = $('#q').value.trim().toLowerCase(), f = $('#f').value;
    const list = rows.filter(r => (!f || r.trang_thai === f) && (!q || Object.values(r).join(' ').toLowerCase().includes(q)));
    const cnt = s => rows.filter(r => r.trang_thai === s).length;
    const st = STATES[view];
    $('#stats').innerHTML = `<div class="stat"><small>Tổng</small><b>${rows.length}</b></div>` + st.map(s => `<div class="stat"><small>${TT[s]}</small><b>${cnt(s)}</b></div>`).join('') +
      (view === 'hoi-phi' ? `<div class="stat"><small>Đã nhận (tiền)</small><b style="font-size:1.25rem">${money(rows.filter(r => r.trang_thai === 'da_nhan').reduce((a, r) => a + (r.so_tien || 0), 0))}</b></div>` : '');
    if (!list.length) { $('#tb').innerHTML = '<tr><td colspan="8" class="empty">Chưa có dữ liệu</td></tr>'; return; }
    const btns = r => st.filter(s => s !== r.trang_thai).map(s => `<button class="${s === st[1] ? 'ok' : s === st[2] ? 'no' : ''}" data-id="${r.id}" data-s="${s}">${TT[s]}</button>`).join('');
    $('#tb').innerHTML = list.map(r => view === 'dang-ky'
      ? `<tr><td><b>${esc(r.ma_ho_so)}</b></td><td><b>${esc(r.ho_ten)}</b><small>${esc(LOAI[r.loai] || r.loai)}${r.nguoi_dai_dien ? ' · ĐD: ' + esc(r.nguoi_dai_dien) : ''}</small></td><td><a href="tel:${esc(r.dien_thoai)}">${esc(r.dien_thoai)}</a><small>${esc(r.email || '')}</small></td><td>${esc(r.xa_phuong)}<small>${r.dien_tich_ha != null ? esc(r.dien_tich_ha) + ' ha' : ''}</small></td><td>${esc((r.nhu_cau || '').split(',').filter(Boolean).map(x => NC[x] || x).join(', '))}</td><td>${when(r.tao_luc)}</td><td><span class="tag t-${r.trang_thai}">${TT[r.trang_thai]}</span>${r.ghi_chu ? `<small>${esc(r.ghi_chu)}</small>` : ''}</td><td><div class="act">${btns(r)}</div></td></tr>`
      : `<tr><td><b>${esc(r.ma_ho_so)}</b></td><td>${esc(r.nam)}</td><td>${esc(r.muc_phi || '')}</td><td>${money(r.so_tien)}</td><td>${esc(r.noi_dung_ck || '')}</td><td>${when(r.tao_luc)}</td><td><span class="tag t-${r.trang_thai}">${TT[r.trang_thai]}</span>${r.ghi_chu ? `<small>${esc(r.ghi_chu)}</small>` : ''}</td><td><div class="act">${btns(r)}</div></td></tr>`).join('');
  }
  $('#tb').addEventListener('click', async e => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    const s = b.dataset.s, needNote = s === 'tu_choi' || s === 'khong_khop';
    const ghi_chu = needNote ? (prompt('Ghi chú lý do (không bắt buộc):') || '') : undefined;
    b.disabled = true;
    try { await call(`/api/admin/${view}/${b.dataset.id}`, { method: 'PATCH', body: JSON.stringify({ trang_thai: s, ghi_chu }) }); await load(); }
    catch (err) { alert(err.message); b.disabled = false; }
  });
  $('#q').addEventListener('input', render); $('#f').addEventListener('change', render); $('#reload').addEventListener('click', load);
  $('#csv').addEventListener('click', async () => {
    try {
      const f = $('#f').value, blob = await (await call(`/api/admin/${view}.csv${f ? '?trang_thai=' + f : ''}`)).blob();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (view === 'dang-ky' ? 'ho-so-hoi-vien' : 'hoi-phi') + '.csv'; a.click(); URL.revokeObjectURL(a.href);
    } catch (e) { alert(e.message); }
  });
  if (tok) login();
})();
</script>
</body>
</html>
