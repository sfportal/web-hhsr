name: Deploy API hội viên (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Kiểm tra secret
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Chưa có secret CLOUDFLARE_API_TOKEN, bỏ qua bước triển khai."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            ADMIN_TOKEN
            SEPAY_API_KEY
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SEPAY_API_KEY: ${{ secrets.SEPAY_API_KEY }}
