name = "hhsr-hoivien"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://sfportal.github.io,http://localhost:8765"
# Mức hội phí theo năm (đồng), đúng theo quy định của Hiệp hội. Ví dụ:
# FEES = '[{"id":"ca_nhan","label":"Hội viên cá nhân","amount":200000}]'
FEES = "[]"
# Dùng khi không có service binding (chạy thử ở máy)
SEPAY_URL = "https://sepay-thuchi.sfportal.workers.dev"

# Gọi thẳng worker sepay-thuchi trong cùng tài khoản Cloudflare
[[services]]
binding = "SEPAY"
service = "sepay-thuchi"

[[d1_databases]]
binding = "DB"
database_name = "hhsr-hoivien"
database_id = "a84398b6-0725-4f3e-8411-c51227532ee2"
migrations_dir = "migrations"
